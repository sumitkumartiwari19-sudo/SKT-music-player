<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKT Music Player - Modern Android Audio Player</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 50px 20px; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #bb86fc; font-size: 2.5em; }
        p { color: #b3b3b3; font-size: 1.2em; line-height: 1.6; }
        .features { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 30px 0; }
        .feature-tag { background: #1e1e1e; border: 1px solid #333; padding: 10px 20px; border-radius: 20px; font-size: 0.9em; }
        .btn-download { display: inline-block; background: #03dac6; color: #000; font-weight: bold; padding: 15px 30px; text-decoration: none; border-radius: 30px; margin-top: 20px; font-size: 1.1em; transition: 0.3s; }
        .btn-download:hover { background: #018786; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SKT Music Player 🎧</h1>
        <p>A modern, offline Material 3 audio player for Android built entirely using <strong>Kotlin</strong>, <strong>Jetpack Compose</strong>, and <strong>Android Media3 (ExoPlayer)</strong>.</p>
        
        <div class="features">
            <div class="feature-tag">🚫 Offline Playback</div>
            <div class="feature-tag">🎨 Material You Theme</div>
            <div class="feature-tag">🔍 Fast Song Search</div>
            <div class="feature-tag">📜 Lyrics Support</div>
            <div class="feature-tag">⏳ Sleep Timer & Equalizer</div>
        </div>

        <!-- Yahan apne GitHub release ka download link dalein -->
        <a href="https://github.com" class="btn-download">Download Latest APK</a>
    </div>
</body>
</html>
